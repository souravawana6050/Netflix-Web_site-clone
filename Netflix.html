<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="Netflix.css" />
  </head>
  <body>
    <header>
      <div class="Bimg">
        <div class="nav">
          <nav>
            <span class="Logo"
              ><img src="images/logo.svg" alt="Netflix"
            /></span>
            <ul>
              <li class="trenslat">
                <span class="languageicon"
                  ><strong
                    ><img
                      src="images/language icon.svg"
                      alt=""
                      width="20" /></strong
                ></span>
                <select>
                  <option>English</option>
                  <option>Hindi</option></select
                ><span class="arrow">▼</span>
              </li>
              <li class="signin">
                <button><strong>Sign In</strong></button>
              </li>
            </ul>
          </nav>
        </div>
        <div class="content">
          <h1>Unlimited movies, shows, and more.</h1>
          <p>Starts at ₹149. Cancel at any time.</p>
          <h3>Ready to watch? Enter your email to create or restart your membership.</h3>
          <div class="input">
            <input id="email" type="email" placeholder="Email address" />
            <button class="get-started"><strong>Get Started ></strong></button>
          </div>
        </div>
      </div>
    </header>
    <div class="gradient"></div>
    <main>
      <div class="boxContent">
        <div class="trending">
          <h3>Trending Now</h3>
        </div>
        <div class="boxes">
          <div class="box1 box">
            <img src="images/box1.jpg" alt="" />
          </div>
          <div class="box2 box">
            <img src="images/box2.jpg" alt="" />
          </div>
          <div class="box3 box">
            <img src="images/box3.jpg" alt="" />
          </div>
          <div class="box4 box">
            <img src="images/box4.jpg" alt="" />
          </div>
          <div class="box5 box">
            <img src="images/box4.jpg" alt="" />
          </div>
          <div class="box6 box">
            <img src="images/box4.jpg" alt="" />
          </div>
          <div class="box7 box">
            <img src="images/box4.jpg" alt="" />
          </div>
          <div class="box8 box">
            <img src="images/box4.jpg" alt="" />
          </div>
          <div class="box9 box">
            <img src="images/box4.jpg" alt="" />
          </div>
          <div class="box10 box">
            <img src="images/box4.jpg" alt="" />
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
